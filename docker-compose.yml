services:
  db:
    image: postgres:16-alpine
    container_name: seo-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-seo_agent}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - seo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo_admin} -d ${POSTGRES_DB:-seo_agent}"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  seo_pgdata:
