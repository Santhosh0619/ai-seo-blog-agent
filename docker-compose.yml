services:
  db:
    image: postgres:16-alpine
    container_name: seo-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-seo_agent}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - seo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo_admin} -d ${POSTGRES_DB:-seo_agent}"]
      interval: 3s
      timeout: 3s
      retries: 20
  # Backend for local development and tests (profile "dev"): docker compose --profile dev up -d app
  app:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: seo-agent-app
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  seo_pgdata:
